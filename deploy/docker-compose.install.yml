# Опциональный мастер первого запуска — поднимает один контейнер с веб-формой,
# которая генерирует секреты, пишет .env всем сервисам и запускает остальной
# стек через docker compose. Полностью необязателен: можно по-прежнему
# настроить .env вручную и запустить "docker compose up" как раньше — этот
# файл ничего не меняет, если его не запускать.
#
# ВАЖНО — запускать строго из каталога deploy/:
#   cd deploy
#   docker compose -f docker-compose.install.yml up -d --build
#   (открыть http://<host>:8900)
#   docker compose -f docker-compose.install.yml down   # после установки
#
# ${PWD} здесь — это и есть каталог deploy/ на хосте (так как команда
# запускается из него), поэтому ${PWD}/.. — абсолютный путь к корню
# репозитория на хосте. Репозиторий монтируется внутрь install-контейнера
# ПО ТОМУ ЖЕ САМОМУ абсолютному пути — это не стилистический выбор, а
# обязательное условие Docker-outside-of-Docker: когда сам install_service
# изнутри вызывает "docker compose up" через смонтированный хостовый
# /var/run/docker.sock, относительные bind-mount пути из deploy/docker-compose.yml
# (например "./initdb") резолвятся клиентом compose относительно ЕГО
# собственного файлового окружения (то есть внутри install-контейнера), а
# итоговый абсолютный путь затем передаётся ХОСТОВОМУ демону как есть. Если
# пути внутри контейнера и на хосте не совпадают буква в букву — хостовый
# демон смонтирует не ту директорию (или вообще ничего).
services:
  install:
    build: ../src/services/install
    container_name: telemax-install
    ports:
      - "8900:8900"
    environment:
      REPO_ROOT: ${PWD}/..
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/..:${PWD}/..
    # No working_dir override here on purpose: it would replace the
    # Dockerfile's own WORKDIR /code (where the baked-in `app` package
    # actually lives) with the bind-mounted host repo's deploy/ directory,
    # which has no such package at all — uvicorn would then fail with
    # "ModuleNotFoundError: No module named 'app'" (caught on a real
    # deploy). The app never relies on its own cwd anyway: REPO_ROOT above
    # is what it reads, and every subprocess call to `docker compose`
    # passes its own explicit cwd=deploy_dir.
