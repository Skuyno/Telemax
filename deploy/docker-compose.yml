services:
  db:
    image: postgres:17
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  nats:
    image: nats:alpine
    container_name: nats
    command: "-js"
  identity:
    build: ../src/services/identity
    container_name: identity
    env_file: ../src/services/identity/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db')\"" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  api-gateway:
    build: ../src/services/api-gateway
    container_name: api-gateway
    env_file: ../src/services/api-gateway/.env
    ports:
      - "8000:8000"
    depends_on:
      identity:
        condition: service_healthy
      communication:
        condition: service_healthy
  communication:
    build: ../src/services/communication
    container_name: communication
    env_file: ../src/services/communication/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db')\"" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
