server {
    listen 80;
    server_name _;

    # Same-origin entry point for the whole app: browser sees one origin
    # (this server), so requests to /api never trigger CORS at all —
    # api-gateway's CORSMiddleware stays only as a fallback for clients
    # that talk to it directly, bypassing nginx.

    # nginx's own default (1m) would 413 an avatar upload (limit 5MB) or
    # any chat file attachment before the request ever reaches
    # file-orchestrator. Left unlimited here on purpose — file size
    # policy is file-orchestrator's job (MAX_UPLOAD_SIZE_BYTES, plus the
    # physical free-space check), not nginx's; don't enforce it twice.
    client_max_body_size 0;

    # Docker's embedded DNS. Upstream hosts are kept in variables below so
    # nginx resolves them lazily per-request instead of once at startup —
    # otherwise nginx refuses to start at all if any one backend (e.g.
    # ws-gateway) isn't up yet when nginx's own container starts.
    #
    # Side effect of a variable in proxy_pass: nginx can no longer do its
    # usual "replace the matched location prefix" trick, so proxy_pass is
    # given no URI part anywhere below — the original request URI is
    # forwarded as-is, and /api/ strips its own prefix via `rewrite` first.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # `set` must come before `rewrite ... break`: break stops every
        # rewrite-module directive left in the block, `set` included.
        set $api_upstream api-gateway:8000;
        # proxy_pass has no URI part here (see note above), so the /api
        # prefix has to be stripped explicitly before proxying.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        set $ws_upstream ws-gateway:4333;
        proxy_pass http://$ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
