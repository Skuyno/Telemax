    value: "http://communication:8000"
  SEAWEEDFS_FILER_URL:
    source: fixed
    value: "http://seaweedfs:8888"
  SEAWEEDFS_VOLUME_URL:
    source: fixed
    value: "http://seaweedfs:8080"
  NATS_PORT:
    source: fixed
    value: "4222"
  UPLOAD_PROGRESS_INTERVAL_BYTES:
    source: fixed
    value: "1048576"
