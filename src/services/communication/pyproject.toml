[project]
name = "communication"
version = "0.1.0"
description = ""
authors = [
    {name = "Skuyno",email = "maks.anisimov211@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "nats-py (>=2.15.0,<3.0.0)",
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
