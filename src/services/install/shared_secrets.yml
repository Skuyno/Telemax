# Secrets referenced by more than one service's install.yml (same value must
# land in several .env files, e.g. JWT_SECRET in identity/api-gateway/
# ws-gateway). A service-local secret that nobody else needs does NOT have
# to be registered here — discovery.py falls back to a generic random_token
# default for any "secret" ref it doesn't find in this file.
postgres_password:
  type: random_token
  length: 24
jwt_secret:
  type: random_token
  length: 48
