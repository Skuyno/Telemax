vars:
  POSTGRES_USER:
    source: fixed
    value: telemax
  POSTGRES_PASSWORD:
    source: secret
    ref: postgres_password
  POSTGRES_DB:
    source: fixed
    value: telemax_identity
  JWT_SECRET:
    source: secret
    ref: jwt_secret
  ALLOW_REGISTRATION:
    source: form
    field: allow_registration
    label: "Разрешить самостоятельную регистрацию"
    input_type: checkbox
    default: "true"
  SUPERUSER_USERNAME:
    source: form
    field: superuser_username
    label: "Имя суперпользователя"
    required: true
  SUPERUSER_PASSWORD:
    source: form
    field: superuser_password
    label: "Пароль суперпользователя"
    input_type: password
    required: true
  SQL_ECHO:
    source: fixed
    value: "false"
